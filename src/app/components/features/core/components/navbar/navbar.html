<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    <a routerLink="/" class="logo">
      <span class="glow-text">Virtual Bookstore</span>
    </a>

    <div class="nav-links" [class.active]="isMobileMenuOpen">
      <a
        routerLink="/"
        class="nav-link"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/catalog" class="nav-link" routerLinkActive="active-link"
        >Catalog</a
      >
      <a
        routerLink="/order-history"
        class="nav-link"
        routerLinkActive="active-link"
        >Order History</a
      >

      <ng-container *ngIf="!isAuthenticated">
        <a routerLink="/login" class="nav-link" routerLinkActive="active-link"
          >Login</a
        >
        <a
          routerLink="/register"
          class="nav-link"
          routerLinkActive="active-link"
          >Register</a
        >
      </ng-container>
    </div>

    <div class="nav-actions">
      <div class="search-wrapper">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          placeholder="Search resources..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
        />
      </div>

      <button
        class="icon-btn cart-btn"
        routerLink="/checkout"
        *ngIf="isAuthenticated"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          ></path>
        </svg>
        <span class="cart-badge" *ngIf="cartItemCount > 0">{{
          cartItemCount
        }}</span>
      </button>

      <div class="profile-widget" *ngIf="isAuthenticated">
        <div class="role-badge" *ngIf="userRole === 'ADMIN'">{{ userRole }}</div>
        <a routerLink="/profile" class="avatar" [title]="username">{{
          userInitials
        }}</a>
        <button
          (click)="logout()"
          class="icon-btn logout-action-btn"
          title="Sign Out"
          style="
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            margin-left: 8px;
          "
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <button class="mobile-toggle" (click)="toggleMobileMenu()">
        <svg
          *ngIf="!isMobileMenuOpen"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg
          *ngIf="isMobileMenuOpen"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</nav>
