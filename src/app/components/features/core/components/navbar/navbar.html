<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    
    <!-- Logo -->
    <a routerLink="/" class="logo">
      <span class="glow-text">Virtual Bookstore</span>
    </a>

    <!-- Main Navigation Links -->
    <div class="nav-links" [class.active]="isMobileMenuOpen">
      
      <a routerLink="/" class="nav-link" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" style="display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
      </a>
      
      <a routerLink="/catalog" class="nav-link" routerLinkActive="active-link" style="display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        Catalog
      </a>
      
      <!-- Only show Order History to logged-in users -->
      <a *ngIf="isAuthenticated" routerLink="/order-history" class="nav-link" routerLinkActive="active-link" style="display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Orders
      </a>

      <!-- NEW: Admin Dashboard Link (Only visible to ADMIN role) -->
      <a *ngIf="userRole === 'ADMIN'" routerLink="/dashboard" class="nav-link" routerLinkActive="active-link" style="display: flex; align-items: center; gap: 8px; color: #00e5ff; text-shadow: 0 0 8px rgba(0, 229, 255, 0.4); font-weight: 500;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Dashboard
      </a>

      <!-- Guest Links -->
      <ng-container *ngIf="!isAuthenticated">
        <a routerLink="/login" class="nav-link" routerLinkActive="active-link" style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login
        </a>
        <a routerLink="/register" class="nav-link" routerLinkActive="active-link">Register</a>
      </ng-container>
    </div>

    <!-- Actions (Search, Cart, Profile) -->
    <div class="nav-actions">
      
      <div class="search-wrapper" style="display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search resources..." [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" style="background: transparent; border: none; color: white; padding: 6px 8px; outline: none; width: 150px; font-size: 0.9rem;" />
      </div>

      <button class="icon-btn cart-btn" routerLink="/checkout" *ngIf="isAuthenticated" style="position: relative; background: transparent; border: none; cursor: pointer; color: white;">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" *ngIf="cartItemCount > 0" style="position: absolute; top: -5px; right: -8px; background: #00e5ff; color: #000; font-size: 0.7rem; font-weight: bold; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
          {{ cartItemCount }}
        </span>
      </button>

      <div class="profile-widget" *ngIf="isAuthenticated" style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 4px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08);">
        <div class="role-badge" *ngIf="userRole === 'ADMIN'" style="background: rgba(0, 229, 255, 0.15); color: #00e5ff; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: bold; letter-spacing: 1px;">
          {{ userRole }}
        </div>
        <a routerLink="/profile" class="avatar" [title]="username" style="background: linear-gradient(135deg, #a770ef, #cf8bf3); color: white; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; text-decoration: none; font-weight: bold; font-size: 0.9rem;">
          {{ userInitials }}
        </a>
        <button (click)="logout()" class="icon-btn logout-action-btn" title="Sign Out" style="background: transparent; border: none; cursor: pointer; color: #ff4d4d; display: flex; align-items: center;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <button class="mobile-toggle" (click)="toggleMobileMenu()">
        <svg *ngIf="!isMobileMenuOpen" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="isMobileMenuOpen" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

    </div>
  </div>
</nav>
