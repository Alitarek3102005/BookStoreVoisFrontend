<div class="auth-layout">
  
  <!-- Ambient Background Glow -->
  <div class="ambient-glow"></div>

  <div class="auth-card glass-panel">
    
    <div class="auth-header">
      <a routerLink="/" class="logo">
        <span class="glow-text">Virtual Bookstore</span>
      </a>
      <h2>Welcome Back</h2>
      <p>Sign in to access your library, labs, and masterclasses.</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      
      <!-- Error Banner -->
      <div class="error-banner" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        {{ errorMessage }}
      </div>

      <!-- Email Input -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password" required>
          
          <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()" tabindex="-1">
            <!-- Eye Off Icon -->
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            <!-- Eye Icon -->
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="form-options">
        <label class="toggle-label">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
          <span class="custom-checkbox"></span>
          Remember me for 30 days
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn btn-glow" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <div class="spinner" *ngIf="isLoading"></div>
      </button>

    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create an account</a></p>
    </div>

  </div>
</div>
